# Full-stack Playwright runs only (SPRING_PROFILES_ACTIVE=local,e2e). Never combine with prod (ProfileGuard).
app:
  security:
    # E2E creates many accounts in parallel; cost 12 costs ~1 s of CPU per login with spring-boot:run (C1 JIT only)
    # and made the suite time out. Same as the test profile. e2e can never run with prod (ProfileGuard).
    session-cookie-secure: false # plain http
    bcrypt-strength: 4
  outbox:
    dispatcher:
      # Emails reach the in-memory mailbox within about a second instead of 15 s.
      fixed-delay-ms: 500
  rate-limit:
    # Many tests sign up / log in from one IP; the per-IP limits would make them flaky.
    limits:
      login: 10000
      signup: 10000
      password-reset-request: 10000
      invitation: 10000
      resend-verification: 10000
      document-upload: 10000
      document-upload-user: 10000
      document-request-user: 10000
      vendor-import-preview-user: 10000
      vendor-export-user: 10000
  reminders:
    # The scheduled job stays off: E2E triggers it explicitly via POST /api/test/reminders/run (deterministic).
    enabled: false
