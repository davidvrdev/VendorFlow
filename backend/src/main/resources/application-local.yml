# Local development defaults; they match the root docker-compose.yml. Never used in prod.
spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/vendorflow}
    username: ${DATABASE_USERNAME:vendorflow}
    password: ${DATABASE_PASSWORD:vendorflow-local}
app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  security:
    session-cookie-secure: false # plain http on localhost
    # Local-only value; prod requires APP_IP_HASH_SECRET.
    ip-hash-secret: ${APP_IP_HASH_SECRET:local-dev-only-ip-hash-secret-change-me}

vendorflow:
  mail:
    postal-address: ${VENDORFLOW_MAIL_POSTAL_ADDRESS:VendorFlow (local development), 1 Example Street, Springfield, USA}
