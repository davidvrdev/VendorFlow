spring:
  application:
    name: vendorflow-api
  profiles:
    # "default" (not "active") so that SPRING_PROFILES_ACTIVE / tests' @ActiveProfiles replace it instead of adding to it.
    default: local
  datasource:
    # No defaults here on purpose: local defaults live in application-local.yml, prod must supply env vars.
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  session:
    # Idle timeout (sliding): every request refreshes it.
    timeout: 8h
    jdbc:
      # Flyway (V2) owns the spring_session tables.
      initialize-schema: never
  mvc:
    problemdetails:
      enabled: true
  servlet:
    multipart:
      # Slightly ABOVE app.documents.max-size (15MB): a file just over our limit must reach our own check, which gives
      # the clear 413; the container limit only stops far larger bodies (also a 413, see GlobalExceptionHandler).
      max-file-size: 16MB
      max-request-size: 17MB

server:
  port: 8080
  # "native" = Tomcat RemoteIpValve: walks X-Forwarded-For right-to-left and honours it ONLY when the immediate peer
  # is a trusted proxy. "framework" (ForwardedHeaderFilter) trusts the client-controlled leftmost entry. All profiles.
  forward-headers-strategy: native
  tomcat:
    # Lets Tomcat swallow (read and discard) an oversized upload body so the client receives the 413 instead of a
    # connection reset. Bounded: larger bodies still get the connection closed.
    max-swallow-size: 32MB
    remoteip:
      # Peers allowed to set X-Forwarded-For/-Proto: loopback + private ranges by default (same as Tomcat's default).
      # Override with a regex via TRUSTED_PROXIES_REGEX (docs/SECURITY.md section 9). \d+ instead of \d{1,3} keeps
      # braces out of the placeholder default.
      internal-proxies: ${TRUSTED_PROXIES_REGEX:10\.\d+\.\d+\.\d+|192\.168\.\d+\.\d+|169\.254\.\d+\.\d+|127\.\d+\.\d+\.\d+|172\.(1[6-9]|2\d|3[01])\.\d+\.\d+|0:0:0:0:0:0:0:1|::1}
  error:
    include-stacktrace: never
    include-message: never
    include-binding-errors: never
    include-exception: false

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
      show-components: never
      probes:
        enabled: true

logging:
  pattern:
    correlation: "[%X{requestId:-}] "

app:
  security:
    # Cost factor of the {bcrypt} encoder (docs/SECURITY.md). Lowered only in the test and e2e profiles for speed.
    bcrypt-strength: 12
    # Secure flag of the VF_SESSION cookie. Fails SAFE: true by default; only local/test/e2e profiles set false.
    session-cookie-secure: true
    # Absolute session lifetime since login (the idle timeout above is sliding); see SessionLifetimeFilter.
    session-absolute-timeout: 7d
  outbox:
    dispatcher:
      enabled: true
      fixed-delay-ms: 15000
      batch-size: 20
  rate-limit:
    # Per client IP, per instance, fixed window. Defaults match docs/API.md; override with
    # app.rate-limit.limits.<rule>=N and app.rate-limit.window=1m.
    enabled: true
    window: 1m
    limits:
      login: 10
      signup: 5
      password-reset-request: 5
      invitation: 20
      resend-verification: 3
      # POST /api/v1/vendors/{id}/documents (multipart upload)
      document-upload: 30
      # same endpoint, per authenticated user id (checked in DocumentUploadService)
      document-upload-user: 30
  documents:
    # Max size of one uploaded document (our own check, before the multipart limits above).
    max-size: 15MB
    # Total stored bytes per organization, all document states (413 "Storage quota exceeded").
    org-quota: 5GB
  storage:
    # Only "filesystem" exists today; an S3-compatible provider comes before Phase 11 (ADR-0007).
    provider: ${STORAGE_PROVIDER:filesystem}
    filesystem:
      # Relative paths resolve against the working directory (backend/ locally; gitignored as backend/storage-data/).
      root: ${STORAGE_FILESYSTEM_ROOT:./storage-data}
