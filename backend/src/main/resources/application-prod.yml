# Production: no datasource defaults (DATABASE_* must be provided; startup fails otherwise).
server:
  forward-headers-strategy: framework

app:
  # No defaults: startup fails if these are missing.
  base-url: ${APP_BASE_URL}
  security:
    session-cookie-secure: true
    ip-hash-secret: ${APP_IP_HASH_SECRET}

logging:
  structured:
    format:
      console: ecs
