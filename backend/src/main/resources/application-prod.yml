# Production: no datasource defaults (DATABASE_* must be provided; startup fails otherwise).
# Forwarded headers / trusted proxies are configured in application.yml (all profiles); see docs/SECURITY.md section 9.

app:
  # No defaults: startup fails if these are missing. ProfileGuard additionally refuses weak values.
  base-url: ${APP_BASE_URL}
  security:
    session-cookie-secure: true # also the global default; kept explicit
    ip-hash-secret: ${APP_IP_HASH_SECRET}

logging:
  structured:
    format:
      console: ecs
