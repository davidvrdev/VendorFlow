name: Backend dependency scan

# Weekly (new CVEs appear without any code change) and on every pull request that touches the backend build.
on:
  schedule:
    - cron: "17 5 * * 1" # Mondays 05:17 UTC
  pull_request:
    paths:
      - "backend/pom.xml"
      - "backend/scripts/osv-scan.mjs"
      - ".github/workflows/security-scan.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  osv:
    name: OSV (key-less gate, fails on high/critical)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      # Resolves the runtime dependency set with Maven and asks api.osv.dev about each coordinate.
      - name: Scan runtime dependencies
        run: node scripts/osv-scan.mjs

  owasp:
    # Deeper NVD/CPE-based scan. Needs the repository secret NVD_API_KEY (free key); skipped without it, never on PRs
    # (the first NVD download takes long and secrets are not available to fork PRs anyway).
    name: OWASP dependency-check (NVD)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: dependency-check
        if: env.NVD_API_KEY != ''
        run: ./mvnw -B -ntp -Psecurity-scan -DskipTests org.owasp:dependency-check-maven:check
      - name: Upload report
        if: env.NVD_API_KEY != '' && always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: backend/target/dependency-check-report.*
          retention-days: 30
      - name: Note when skipped
        if: env.NVD_API_KEY == ''
        run: echo "NVD_API_KEY secret not set: OWASP dependency-check skipped (the OSV job above is the gate)."
